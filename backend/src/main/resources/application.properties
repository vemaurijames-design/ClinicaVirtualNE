spring.application.name=holistica-backend
server.port=8080

# ── BASE DE DATOS — PostgreSQL ──────────────────────────────────
# Tus datos de conexión local
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_holistica
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=12345678

# ── JPA / Hibernate ─────────────────────────────────────────────
# update = crea las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── CONSOLA H2 (desactivada con PostgreSQL) ─────────────────────
spring.h2.console.enabled=false

# ── JWT ──────────────────────────────────────────────────────────
# Secreto para firmar los tokens de sesión
app.jwt.secret=CuidateSaludPlenaSecretKeyParaJWT2024Clinica!!Segura
# Tiempo de expiración: 24 horas en milisegundos
app.jwt.expiration-ms=86400000

# ── GEMINI AI (Diagnóstico) ──────────────────────────────────────
# Pega aquí tu clave de Google AI Studio
# Obtener GRATIS en: https://aistudio.google.com/app/apikey
app.gemini.api-key=PEGA_TU_CLAVE_GEMINI_AQUI
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# ── EMAIL (Hotmail/Outlook) ──────────────────────────────────────
# Configuración para Hotmail — las notificaciones llegarán a este correo
spring.mail.host=smtp-mail.outlook.com
spring.mail.port=587
spring.mail.username=mantenimientojms@hotmail.com
spring.mail.password=PEGA_TU_PASSWORD_HOTMAIL_AQUI
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000

# Correo donde llegan las notificaciones de la clínica
app.mail.from=mantenimientojms@hotmail.com
app.mail.clinic-email=mantenimientojms@hotmail.com

# ── CORS ──────────────────────────────────────────────────────────
# Permite peticiones desde el frontend React
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── LOGGING ───────────────────────────────────────────────────────
logging.level.com.clinica=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
