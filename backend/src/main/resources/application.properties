# ═══════════════════════════════════════════════
# CONSULTORIO HOLÍSTICO — Configuración principal
# ═══════════════════════════════════════════════

spring.application.name=holistica-backend
server.port=8080

# ── Base de datos ──────────────────────────────
# DESARROLLO (H2 en memoria — sin instalar nada)
spring.datasource.url=jdbc:h2:file:./data/clinicadb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 para ver datos en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── JWT ────────────────────────────────────────
# CAMBIA este secreto en producción (mínimo 256 bits / 32 caracteres)
app.jwt.secret=CuidateSaludPlenaSecretKeyParaJWT2024MuySegura!!
app.jwt.expiration-ms=86400000

# ── Gemini AI ──────────────────────────────────
# Obtén tu clave gratuita en: https://aistudio.google.com/app/apikey
app.gemini.api-key=${GEMINI_API_KEY:TU_API_KEY_AQUI}
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# ── Email (opcional — para notificaciones) ─────
# Usa Gmail o cualquier SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_USERNAME:no-reply@cuidatesaludplena.com}
app.mail.clinic-email=${CLINIC_EMAIL:nikolas@cuidatesaludplena.com}

# ── CORS ───────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Logging ────────────────────────────────────
logging.level.com.clinica=DEBUG
logging.level.org.springframework.security=WARN
