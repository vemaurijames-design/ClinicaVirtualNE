# ═══════════════════════════════════════════════
# PERFIL PostgreSQL — activa con: --spring.profiles.active=postgres
# ═══════════════════════════════════════════════

# Cambia estos valores con los de tu instalación local
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_holistica
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:tu_password_aqui}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
